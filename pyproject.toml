[project]
name = "mojo-soundfile"
version = "0.1.0"
description = "SoundFile-compatible WAV and FLAC I/O accelerated by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "audio", "wav", "flac", "pcm"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "soundfile"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-soundfile"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
